<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatAI — Professional Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #1a2238, #0b1020);
      color: #f5f7fb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px;
      background: linear-gradient(90deg, #ffd54a, #ffb300);
      color: #000;
      font-weight: bold;
      font-size: 20px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .msg {
      max-width: 70%;
      margin: 10px 0;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user {
      background: #1b244a;
      margin-left: auto;
      border: 1px solid rgba(255,255,255,.12);
    }
    .ai {
      background: #111833;
      border: 1px solid rgba(255,255,255,.08);
      margin-right: auto;
      position: relative;
    }
    .speak-btn {
      display: inline-block;
      margin-top: 6px;
      background: #ffd54a;
      color: #000;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    #inputBar {
      display: flex;
      padding: 12px;
      background: #111833;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    #userInput {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    button {
      margin-left: 8px;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .send {
      background: #ffd54a;
      color: #000;
    }
    .mic {
      background: #1b244a;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>ChatAI — Professional Assistant</header>

  <div id="chat"></div>

  <div id="inputBar">
    <input id="userInput" type="text" placeholder="Type your message..." />
    <button class="mic" id="micBtn">🎤</button>
    <button class="send" id="sendBtn">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    // Conversation memory (max 60 messages)
    const conversation = [
      { role: "system", content: "You are ChatAI, a helpful, professional assistant. Answer clearly and normally." }
    ];

    // Add message to UI
    function addMessage(text, sender, speakable=false) {
      const msg = document.createElement("div");
      msg.className = "msg " + sender;
      msg.textContent = text;

      if (sender === "ai" && speakable) {
        const speakBtn = document.createElement("div");
        speakBtn.className = "speak-btn";
        speakBtn.textContent = "🔊 Speak";
        speakBtn.onclick = () => speakText(text);
        msg.appendChild(document.createElement("br"));
        msg.appendChild(speakBtn);
      }

      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    // Text-to-speech
    function speakText(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      speechSynthesis.speak(utter);
    }

    // Send to AI
    async function sendToAI(message) {
      // Show in chat
      addMessage(message, "user");

      // Save in memory
      conversation.push({ role: "user", content: message });
      if (conversation.length > 61) conversation.splice(1, conversation.length - 61);

      try {
        const res = await fetch("/api/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversation })
        });

        const data = await res.json();
        const reply = data?.choices?.[0]?.message?.content || "AI did not reply.";

        // Add AI message to chat and memory
        addMessage(reply, "ai", true);
        conversation.push({ role: "assistant", content: reply });
        if (conversation.length > 61) conversation.splice(1, conversation.length - 61);

      } catch (err) {
        console.error(err);
        addMessage("Error: could not reach AI.", "ai");
      }
    }

    // Send button
    sendBtn.onclick = () => {
      const text = userInput.value.trim();
      if (text) {
        sendToAI(text);
        userInput.value = "";
      }
    };

    // Enter key
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendBtn.click();
    });

    // Speech recognition
    function initSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert("Speech recognition not supported."); return null; }
      const recog = new SR();
      recog.lang = "en-US";
      recog.interimResults = false;
      return recog;
    }

    micBtn.onclick = () => {
      const recog = initSpeech();
      if (!recog) return;
      recog.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        userInput.value = transcript;
        sendBtn.click();
      };
      recog.start();
    };
  </script>
</body>
</html>
