<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatAI — Professional Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: url('https://www.transparenttextures.com/patterns/cubes.png'),
                  linear-gradient(135deg, #fdfbfb, #ebedee);
      background-size: cover;
      color: #222;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 16px;
      background: linear-gradient(90deg, #ffd54a, #ffb300);
      color: #000;
      font-weight: bold;
      font-size: 22px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    #chat-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      overflow-y: auto;
    }
    #chat {
      flex: 1;
      max-width: 900px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
      animation: fadeIn .4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg {
      display: flex;
      align-items: flex-start;
      margin: 14px 0;
      gap: 10px;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      max-width: 75%;
      animation: pop .3s ease;
      word-wrap: break-word;
    }
    @keyframes pop {
      from { transform: scale(.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .user .bubble {
      background: #ffd54a;
      color: #000;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .ai .bubble {
      background: #f1f3f6;
      color: #222;
      margin-right: auto;
      border-bottom-left-radius: 4px;
      position: relative;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: #eee;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .speak-btn {
      display: inline-block;
      margin-top: 6px;
      background: #ffb300;
      color: #000;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    #inputBar {
      display: flex;
      padding: 14px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(0,0,0,.1);
    }
    #userInput {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
      outline: none;
    }
    button {
      margin-left: 8px;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .15s;
    }
    button:active { transform: scale(.95); }
    .send {
      background: #ffd54a;
      color: #000;
    }
    .mic {
      background: #1b244a;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>ChatAI — Professional Assistant</header>

  <div id="chat-container">
    <div id="chat"></div>
  </div>

  <div id="inputBar">
    <input id="userInput" type="text" placeholder="Type your message..." />
    <button class="mic" id="micBtn">🎤</button>
    <button class="send" id="sendBtn">Send</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    // Conversation memory (max 60 messages)
    const conversation = [
      { role: "system", content: "You are ChatAI, a professional AI assistant. Respond normally in detailed, clear answers." }
    ];

    // Add message to UI
    function addMessage(text, sender, speakable=false) {
      const msg = document.createElement("div");
      msg.className = "msg " + sender;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = sender === "user" ? "🙂" : "🤖";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      if (sender === "ai" && speakable) {
        const speakBtn = document.createElement("div");
        speakBtn.className = "speak-btn";
        speakBtn.textContent = "🔊 Speak";
        speakBtn.onclick = () => speakText(text);
        bubble.appendChild(document.createElement("br"));
        bubble.appendChild(speakBtn);
      }

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    // Text-to-speech
    function speakText(text) {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      speechSynthesis.speak(utter);
    }

    // Send to AI
    async function sendToAI(message) {
      // Show in chat
      addMessage(message, "user");

      // Save in memory
      conversation.push({ role: "user", content: message });
      if (conversation.length > 61) conversation.splice(1, conversation.length - 61);

      try {
        const res = await fetch("/api/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversation })
        });

        const data = await res.json();
        const reply = data?.choices?.[0]?.message?.content || "AI did not reply.";

        // Add AI message to chat and memory
        addMessage(reply, "ai", true);
        conversation.push({ role: "assistant", content: reply });
        if (conversation.length > 61) conversation.splice(1, conversation.length - 61);

      } catch (err) {
        console.error(err);
        addMessage("Error: could not reach AI.", "ai");
      }
    }

    // Send button
    sendBtn.onclick = () => {
      const text = userInput.value.trim();
      if (text) {
        sendToAI(text);
        userInput.value = "";
      }
    };

    // Enter key
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendBtn.click();
    });

    // Speech recognition
    function initSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert("Speech recognition not supported."); return null; }
      const recog = new SR();
      recog.lang = "en-US";
      recog.interimResults = false;
      return recog;
    }

    micBtn.onclick = () => {
      const recog = initSpeech();
      if (!recog) return;
      recog.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        userInput.value = transcript;
        sendBtn.click();
      };
      recog.start();
    };
  </script>
</body>
</html>
